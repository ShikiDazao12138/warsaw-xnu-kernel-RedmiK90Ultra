# Device profile: sourced by common/build.sh and common/run.sh.
# warsaw = REDMI K90 Ultra (K90 至尊版), M332BF / 2604FRK1EC, SM8750-AB.
# Sibling of annibale (REDMI K90): same SoC, same Adreno 830, same WCN7850 radio, same Goodix touch.
# Every value below was measured on the device itself; where it came from is in the comment.

NAME="REDMI K90 Ultra (warsaw)"
KIND=phone                      # phone | qemu
SOC="Qualcomm SM8750-AB (Snapdragon 8 Elite)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# The phone boots a Mu-Silicium UEFI (Project Silicium) with `fastboot boot`; the UEFI starts our loader.
UEFI_TARGET=warsaw
UEFI_FD=                        # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/warsawPkg/... or prebuilt/uefi
DTB=common/devices/warsaw.dtb   # adb pull /sys/firmware/fdt (sha256 6296d0d6...576a, 895020 bytes)
FD_BASE=0xA7100000              # SM8750 UEFI load region; matches xbl_config_a's embedded DT (UEFI_FD tag)
FD_SIZE=0x300000                # 3 MiB; 0xA7100000+0x300000 = 0xA7400000, the start of UEFI_FD_Reserved
PAYLOAD_BASE=0xF0000000         # free RAM in the memory map for the kernel + images container
PAYLOAD_CAP=0x03700000          # full-container cap the strict BootShim/mkxnuimg accept

# --- kernel and loader -----------------------------------------------------------------------------
# xnuloader/platform_private.h picks its `struct platform` by the framebuffer base the firmware reports.
FB_BASE=0xFC800000              # splash_region in the device tree: 0xfc800000 + 0x2b00000
LOADER_CFLAGS="-DDIRECT_PHONE_PLAT -DWARSAW"   # DIRECT_PHONE_PLAT: the panel lights no GOP the loader can
                                      # match (as on annibale), so the build writes xnuloader/loader-phone.efi
                                      # and never touches loader.efi. WARSAW selects platform_warsaw and the
                                      # 1280x2772 geometry (platform_private.h, PLAT_PHONE/PLAT_PANEL_W)
WIFI_ATH11K=0                   # 0: warsaw's radio is WCN7850 (ath12k), not WCN6750 (ath11k)

# --- what the run needs ----------------------------------------------------------------------------
BOOTARGS="touchscreen=2 cpus=8"   # 2 = the goodix path (same panel vendor as annibale); 1 is redwood's
DEFAULT_SECS=900
USERLAND_VARS=""                # extra variables for userland/build.sh, e.g. "GL=1"
# The phone's own firmware, taken from its Android (never in the repository). For warsaw that is
# /vendor/firmware_mnt/image/kiwi/ (WCN7850: 179 files, kiwi_v2 is the active chip) and the Adreno 830
# blob (gen80000_*). Pull both before the first kernel that starts Wi-Fi or the GPU.
FIRMWARE=""
